name: hapmixQTL tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  synthetic-checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Python dependencies
        run: python -m pip install -e '.[test]'
      - name: Install R and edgeR
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends r-base r-bioc-edger
      - name: Test hapmixQTL and mixQTL
        env:
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
        run: |
          python -m pytest -q \
            tests/test_hapmixqtl.py tests/test_hapmixqtl_calibration.py \
            tests/test_hapmixqtl_perm_scheme.py tests/test_hapmixqtl_point_estimates.py \
            tests/test_hapmixqtl_allelic_df.py tests/test_hapmixqtl_meier.py \
            tests/test_half_read_default.py tests/test_half_read_runner.py \
            tests/test_fitted_variance_quarantine.py tests/fitted_variance/ \
            tests/test_cli.py tests/test_mixqtl_replication.py \
            tests/test_prepare_hapmixqtl_inputs.py
      - name: Run documented fabricated-input walkthrough
        env:
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
        run: |
          python example/hapmixqtl/create_toy_inputs.py --out toy
          python scripts/prepare_hapmixqtl_inputs.py \
            --manifest toy/manifest.tsv --tx2gene toy/tx2gene.tsv \
            --vcf toy/phased.vcf --sample-covariates toy/sample_covariates.tsv \
            --out toy/prepared
          python scripts/run_hapmixqtl_from_salmon.py \
            --manifest toy/manifest.tsv --tx2gene toy/tx2gene.tsv \
            --vcf toy/phased.vcf --gene-pos toy/gene_pos.tsv \
            --covariates toy/prepared/covariates.tsv \
            --edger-dir toy/prepared/point_estimates/edger --out toy/results
